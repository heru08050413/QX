# =====================================================================
# Clash_iso V26.00 · Clash by Hako(clash.md)iPhone 完整配置
# 2026-11-01
#
# 用法(详见同目录 README.md):
#   推荐:作为「规则方案」使用。Hako 配置中心 → 创建配置(Create Profile):
#     节点 = 你的机场订阅 + Custom Nodes;规则 = 本方案。
#     合成时带 include-all 的组自动收入所有选中节点,按名字分进地区组,
#     本文件自己的 proxies / proxy-providers 不参与(下面的占位符不用改)。
#   备用:直接作为完整配置导入,则需把 proxy-providers 的 url 换成机场链接、
#     自建节点写进 proxies:。
#
# 设计取舍:
#   - 去广告:本文件做域名级拦截;YouTube 视频内广告、画中画、后台播放
#     需在 App 的 Modules 里开 HTTPS Decryption 并添加 Maasea 模块(见 README)。
#     下面拒绝 YouTube 的 UDP 443 是该模块生效的前提(QUIC 无法解密)。
#   - 省电:测速组全部 lazy(组没人用就不测速),间隔 900 秒;
#     订阅不做健康检查;规则用 MRS 二进制格式;日志级别 warning。
#   - 稳定:地区池用 Google 自家 204 探针,能到 Cloudflare 但到不了 Google
#     的节点会被换掉;YouTube 的 UDP 443 拒绝,强制走 TCP。
#   - 不含任何订阅 token,不关闭证书校验。
# =====================================================================

mode: rule
log-level: warning
ipv6: false
allow-lan: false
unified-delay: true
tcp-concurrent: true
find-process-mode: off
keep-alive-idle: 600
keep-alive-interval: 30
geo-auto-update: false

profile:
  store-selected: true     # 记住你手动选的节点
  store-fake-ip: true

dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
    - "*.lan"
    - "+.local"
    - "+.localhost"
    - "+.ts.net"
    - "+.push.apple.com"
    - "time.*.com"
    - "time.*.apple.com"
    - "ntp.*.com"
    - "+.msftconnecttest.com"
    - "+.msftncsi.com"
    - "localhost.ptlogin2.qq.com"
    - "stun.*.*"
    - "stun.*.*.*"
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver:
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query
  proxy-server-nameserver:
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query

# ---------------------------------------------------------------------
# 自建节点:去掉 # 号并填写。名字里带地区词(如 美国 / US / 🇺🇸)会进对应地区池,
# 不带就进「其他节点」。无论哪种,都在「自动选择」「全部节点」里。
# ---------------------------------------------------------------------
proxies:
  # - name: "🇺🇸 自建-洛杉矶"
  #   type: vless
  #   server: your.server.com
  #   port: 443
  #   uuid: 00000000-0000-0000-0000-000000000000
  #   network: tcp
  #   tls: true
  #   udp: true
  #   flow: xtls-rprx-vision
  #   servername: your.server.com
  #   client-fingerprint: chrome
  #   reality-opts:
  #     public-key: YOUR_PUBLIC_KEY
  #     short-id: YOUR_SHORT_ID
  #
  # - name: "自建-Hysteria2"
  #   type: hysteria2
  #   server: your.server.com
  #   port: 443
  #   password: YOUR_PASSWORD
  #   sni: your.server.com

# ---------------------------------------------------------------------
# 机场订阅:把 url 换成你的订阅链接。多个机场就复制一段、改名字和 path。
# ---------------------------------------------------------------------
proxy-providers:
  机场订阅:
    type: http
    url: "https://REPLACE-WITH-YOUR-SUBSCRIPTION-URL"
    interval: 86400
    path: ./providers/airport-1.yaml
    proxy: DIRECT
    header:
      User-Agent:
        - "clash.meta"
    health-check:
      enable: false        # 测速交给下面的 lazy 分组,订阅本身不测,省电
  # 机场订阅2:
  #   type: http
  #   url: "https://REPLACE-WITH-YOUR-SECOND-SUBSCRIPTION-URL"
  #   interval: 86400
  #   path: ./providers/airport-2.yaml
  #   proxy: DIRECT
  #   header:
  #     User-Agent:
  #       - "clash.meta"
  #   health-check:
  #     enable: false

# ---------------------------------------------------------------------
# 策略组
#   include-all: true = 收入 proxies 里的自建节点 + 所有订阅里的节点
#   exclude-filter 去掉「剩余流量/到期时间」之类的信息节点
# ---------------------------------------------------------------------
proxy-groups:
  - name: 节点选择
    type: select
    proxies: [美国节点, 自动选择, 香港节点, 台湾节点, 日本节点, 新加坡节点, 其他节点, 全部节点, DIRECT]
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Proxy.png

  - name: YouTube
    type: select
    proxies: [美国节点, 日本节点, 新加坡节点, 台湾节点, 香港节点, 自动选择, 全部节点]
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/YouTube.png

  - name: AI
    type: select
    proxies: [美国节点, 日本节点, 新加坡节点, 台湾节点, 自动选择, 全部节点]
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/ChatGPT.png

  - name: 谷歌服务
    type: select
    proxies: [节点选择, 美国节点, 香港节点, 日本节点, 新加坡节点, 台湾节点, 全部节点]
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Google_Search.png

  - name: Telegram
    type: select
    proxies: [节点选择, 新加坡节点, 香港节点, 美国节点, 日本节点, 全部节点]
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Telegram.png

  - name: 社交媒体
    type: select
    proxies: [美国节点, 日本节点, 新加坡节点, 台湾节点, 节点选择, 全部节点]
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Twitter.png

  - name: 流媒体
    type: select
    proxies: [节点选择, 新加坡节点, 香港节点, 台湾节点, 日本节点, 美国节点, 全部节点]
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Netflix.png

  - name: 苹果服务
    type: select
    proxies: [DIRECT, 节点选择, 美国节点, 香港节点]
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Apple.png

  - name: 微软服务
    type: select
    proxies: [DIRECT, 节点选择]
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Microsoft.png

  # REJECT = 拦截;PASS = 暂停拦截(继续匹配后面的规则,不是改成直连)
  - name: 广告拦截
    type: select
    proxies: [REJECT, PASS]
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Advertising.png

  - name: 漏网之鱼
    type: select
    proxies: [节点选择, DIRECT]
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Final.png

  # ---- 以下为节点池,全部 lazy:没有流量用到这个池时不测速 ----
  - name: 自动选择
    type: url-test
    include-all: true
    exclude-filter: "(?i)剩余|到期|过期|官网|流量|套餐|网站|售后|客服|更新|expire|traffic|reset"
    url: https://cp.cloudflare.com/generate_204
    expected-status: 204
    interval: 900
    tolerance: 150
    timeout: 3000
    lazy: true
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Auto.png

  - name: 全部节点
    type: select
    include-all: true
    exclude-filter: "(?i)剩余|到期|过期|官网|流量|套餐|网站|售后|客服|更新|expire|traffic|reset"
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Available.png

  - name: 美国节点
    type: url-test
    include-all: true
    filter: "(?i)🇺🇸|美国|美國|洛杉矶|洛杉磯|西雅图|芝加哥|纽约|凤凰城|硅谷|(?:^|[^a-z])(?:us|usa|united[ _-]?states|america|los[ _-]?angeles|silicon[ _-]?valley)(?:$|[^a-z])"
    exclude-filter: "(?i)剩余|到期|过期|官网|流量|套餐|网站|售后|客服|更新|expire|traffic|reset"
    url: https://www.gstatic.com/generate_204
    expected-status: 204
    interval: 900
    tolerance: 200
    timeout: 5000
    lazy: true
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/United_States.png

  - name: 香港节点
    type: url-test
    include-all: true
    filter: "(?i)🇭🇰|香港|深港|沪港|京港|(?:^|[^a-z])(?:hk|hkg|hong[ _-]?kong)(?:$|[^a-z])"
    exclude-filter: "(?i)剩余|到期|过期|官网|流量|套餐|网站|售后|客服|更新|expire|traffic|reset"
    url: https://www.gstatic.com/generate_204
    expected-status: 204
    interval: 900
    tolerance: 200
    timeout: 5000
    lazy: true
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Hong_Kong.png

  - name: 台湾节点
    type: url-test
    include-all: true
    filter: "(?i)🇹🇼|台湾|台灣|台北|台中|新北|彰化|(?:^|[^a-z])(?:tw|twn|taiwan|taipei)(?:$|[^a-z])"
    exclude-filter: "(?i)剩余|到期|过期|官网|流量|套餐|网站|售后|客服|更新|expire|traffic|reset"
    url: https://www.gstatic.com/generate_204
    expected-status: 204
    interval: 900
    tolerance: 200
    timeout: 5000
    lazy: true
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Taiwan.png

  - name: 日本节点
    type: url-test
    include-all: true
    filter: "(?i)🇯🇵|日本|东京|東京|大阪|(?:^|[^a-z])(?:jp|japan|tokyo|osaka)(?:$|[^a-z])"
    exclude-filter: "(?i)剩余|到期|过期|官网|流量|套餐|网站|售后|客服|更新|expire|traffic|reset"
    url: https://www.gstatic.com/generate_204
    expected-status: 204
    interval: 900
    tolerance: 200
    timeout: 5000
    lazy: true
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Japan.png

  - name: 新加坡节点
    type: url-test
    include-all: true
    filter: "(?i)🇸🇬|新加坡|狮城|獅城|(?:^|[^a-z])(?:sg|sgp|singapore)(?:$|[^a-z])"
    exclude-filter: "(?i)剩余|到期|过期|官网|流量|套餐|网站|售后|客服|更新|expire|traffic|reset"
    url: https://www.gstatic.com/generate_204
    expected-status: 204
    interval: 900
    tolerance: 200
    timeout: 5000
    lazy: true
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Singapore.png

  # 名字里没有上面五个地区词的节点(其他国家、或你没写地区的自建节点)
  - name: 其他节点
    type: url-test
    include-all: true
    exclude-filter: "(?i)剩余|到期|过期|官网|流量|套餐|网站|售后|客服|更新|expire|traffic|reset|🇺🇸|🇭🇰|🇹🇼|🇯🇵|🇸🇬|美国|美國|洛杉矶|洛杉磯|西雅图|芝加哥|纽约|凤凰城|硅谷|香港|深港|沪港|京港|台湾|台灣|台北|台中|新北|彰化|日本|东京|東京|大阪|新加坡|狮城|獅城|(?:^|[^a-z])(?:us|usa|united[ _-]?states|america|los[ _-]?angeles|silicon[ _-]?valley|hk|hkg|hong[ _-]?kong|tw|twn|taiwan|taipei|jp|japan|tokyo|osaka|sg|sgp|singapore)(?:$|[^a-z])"
    url: https://cp.cloudflare.com/generate_204
    expected-status: 204
    interval: 900
    tolerance: 150
    timeout: 3000
    lazy: true
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Global.png

