# ---------------------------------------------------------------------
# 分流规则(从上往下,先命中先生效)
# ---------------------------------------------------------------------
rules:
  # 内网 / Tailscale / 本地
  - DOMAIN-SUFFIX,lan,DIRECT
  - DOMAIN-SUFFIX,local,DIRECT
  - DOMAIN-SUFFIX,localhost,DIRECT
  - DOMAIN-SUFFIX,ts.net,DIRECT
  - IP-CIDR,0.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,100.64.0.0/10,DIRECT,no-resolve
  - IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,169.254.0.0/16,DIRECT,no-resolve
  - IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
  - IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
  - IP-CIDR,224.0.0.0/4,DIRECT,no-resolve
  - IP-CIDR6,::1/128,DIRECT,no-resolve
  - IP-CIDR6,fc00::/7,DIRECT,no-resolve
  - IP-CIDR6,fe80::/10,DIRECT,no-resolve

  # 连通性保护:放在广告拦截前面,避免误拦后转圈
  #   微信 / 微博 / 知乎 / Apple 推送;三大运营商本机号码一键登录
  - DOMAIN-SUFFIX,weixin.qq.com,DIRECT
  - DOMAIN-SUFFIX,weixin.com,DIRECT
  - DOMAIN-SUFFIX,wechat.com,DIRECT
  - DOMAIN-SUFFIX,qpic.cn,DIRECT
  - DOMAIN-SUFFIX,qlogo.cn,DIRECT
  - DOMAIN-SUFFIX,api.weibo.cn,DIRECT
  - DOMAIN-SUFFIX,weibo.com,DIRECT
  - DOMAIN-SUFFIX,zhihu.com,DIRECT
  - DOMAIN-SUFFIX,zhimg.com,DIRECT
  - DOMAIN-SUFFIX,push.apple.com,DIRECT
  - DOMAIN-SUFFIX,cmpassport.com,DIRECT
  - DOMAIN-SUFFIX,id6.me,DIRECT
  - DOMAIN,opencloud.wostore.cn,DIRECT
  # ChatGPT 的监控上报域名,被广告规则拦掉会导致 ChatGPT 报错
  - DOMAIN-SUFFIX,browser-intake-datadoghq.com,AI

  # 去广告(域名级)
  - RULE-SET,广告,广告拦截

  # YouTube 的 UDP 443(QUIC)拒绝,让 App 立即改用 TCP:
  #   QUIC 经代理常被限速或丢包,强制 TCP 后起播更快、拖动不卡。
  #   只拦 App 自身的 QUIC,不影响 Hysteria2/TUIC 节点本身的传输。
  - AND,((DOMAIN-SUFFIX,googlevideo.com),(NETWORK,UDP),(DST-PORT,443)),REJECT
  - AND,((DOMAIN-SUFFIX,youtube.com),(NETWORK,UDP),(DST-PORT,443)),REJECT
  - AND,((DOMAIN,youtubei.googleapis.com),(NETWORK,UDP),(DST-PORT,443)),REJECT
  # 2026-11-07: 缩略图/头像也拒 QUIC. 截图实证 i.ytimg.com 的 QUIC 经节点 0 KB 失败后才回落 HTTPS, 拖慢首页.
  - AND,((DOMAIN-SUFFIX,ytimg.com),(NETWORK,UDP),(DST-PORT,443)),REJECT
  - AND,((DOMAIN-SUFFIX,ggpht.com),(NETWORK,UDP),(DST-PORT,443)),REJECT

