# =====================================================================
# Clash_iso V26.00 · Clash by Hako(clash.md)iPhone 完整配置
# 更新: 2026-11-27 (安全分流 DoH / Sniffer 嗅探 / HTTPDNS 与 QUIC 防衰减 / 切网自愈)
#
# 用法(详见同目录 README.md):
#   推荐:作为「规则方案」使用。Hako 配置中心 → 创建配置(Create Profile):
#     节点 = 你的机场订阅 + Custom Nodes;规则 = 本方案。
#     合成时带 include-all 的组自动收入所有选中节点,按名字分进地区组,
#     本文件自己的 proxies / proxy-providers 不参与(下面的占位符不用改)。
#   备用:直接作为完整配置导入,则需把 proxy-providers 的 url 换成机场链接、
#     自建节点写进 proxies:。
#
# 设计取舍:
#   - 安全第一 DNS:Fake-IP 瞬时响应 + respect-rules 加密分流 DoH:
#     海外域名真实解析走代理隧道送往 Cloudflare/Google DoH(国内 DNS 零感知);
#     节点域名与国内直连走国内加密 IP-DoH(防运营商 UDP:53 劫持且拿就近 CDN)。
#   - 去广告防衰减:内置 HTTPDNS 规则集 + 22 段硬编码 HTTPDNS IP 封堵 +
#     国内高频开屏/信息流 API 与 YouTube 的 UDP 443(QUIC) 阻断 + Sniffer 纯 IP 嗅探。
#   - 丝滑与省电:测速组全部 lazy(组没人用就不测速),间隔 300 秒、容差 100ms;
#     TCP 保活收紧至 120s/15s 加速蜂窝/电梯切网僵尸连接回收;全 MRS 二进制规则集。
#   - 不含任何订阅 token,不关闭证书校验。
# =====================================================================

mode: rule
log-level: warning
ipv6: false
allow-lan: false
unified-delay: true
tcp-concurrent: true
find-process-mode: off
keep-alive-idle: 120
keep-alive-interval: 15
geo-auto-update: false

profile:
  store-selected: true     # 记住你手动选的节点
  store-fake-ip: true

sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  override-destination: false
  sniff:
    HTTP:
      ports: [80, 8080-8880]
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  skip-domain:
    - "+.push.apple.com"
    - "+.ts.net"
    - "Mijia Cloud"

dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter-mode: blacklist
  respect-rules: true
  fake-ip-filter:
    # 内网 / Tailscale MagicDNS 与控制面 / 家庭域名
    - "+.lan"
    - "+.local"
    - "+.localhost"
    - "+.home.arpa"
    - "+.ts.net"
    - "+.tailscale.com"
    - "+.tailscale.io"
    # 常见家用路由器与 NAS 管理域(避免被 Fake-IP 劫持)
    - "+.miwifi.com"
    - "+.tplogin.cn"
    - "+.tplinkwifi.net"
    - "+.tplinklogin.net"
    - "+.routerlogin.net"
    - "+.orbilogin.com"
    - "+.melogin.cn"
    - "+.falogin.cn"
    - "router.asus.com"
    - "router.synology.com"
    - "+.synology.me"
    - "+.quickconnect.to"
    - "+.quickconnect.cn"
    # 运营商本机号码一键登录(SDK 校验解析 IP,拿到 Fake-IP 会失败)
    - "+.cmpassport.com"
    - "id6.me"
    - "open.e.189.cn"
    - "mdn.open.wo.cn"
    - "opencloud.wostore.cn"
    - "auth.wosms.cn"
    - "+.10099.com.cn"
    # Apple 推送 / NTP / 连通性检测 / STUN
    - "+.push.apple.com"
    - "time.*.com"
    - "time.*.apple.com"
    - "ntp.*.com"
    - "+.msftconnecttest.com"
    - "+.msftncsi.com"
    - "localhost.ptlogin2.qq.com"
    - "stun.*.*"
    - "stun.*.*.*"
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  proxy-server-nameserver:
    - https://223.5.5.5/dns-query
    - https://1.12.12.12/dns-query
  direct-nameserver:
    - https://223.5.5.5/dns-query
    - https://1.12.12.12/dns-query
  nameserver:
    - https://1.1.1.1/dns-query
    - https://dns.google/dns-query
  nameserver-policy:
    # 家里内网/路由器域名走系统 DNS,不送公共 DoH
    # 注意:iOS 同时只能开一个 VPN;未确认 Hako 内置 type: tailscale + ts://tailscale 前,
    # 先不在 nameserver-policy 写死 "+.ts.net": "100.100.100.100",避免 Hako 开启期间 *.ts.net 超时。
    # 若真机确认 Hako 支持 Mihomo type: tailscale 出站,可改配 tsnet 出站 + ts://tailscale。
    "+.lan": system
    "+.local": system
    "+.home.arpa": system
    "+.miwifi.com": system
    "+.tplogin.cn": system
    "+.tplinkwifi.net": system
    "+.tplinklogin.net": system
    "+.routerlogin.net": system
    "+.orbilogin.com": system
    "+.melogin.cn": system
    "+.falogin.cn": system
    "router.asus.com": system
    "router.synology.com": system
    "rule-set:国内,私网":
      - https://223.5.5.5/dns-query
      - https://1.12.12.12/dns-query

# ---------------------------------------------------------------------
# 自建节点:去掉 # 号并填写。名字里带地区词(如 美国 / US / 🇺🇸)会进对应地区池,
# 不带就进「其他节点」。无论哪种,都在「自动选择」「全部节点」里。
# ---------------------------------------------------------------------
proxies:
  # - name: "🇺🇸 自建-洛杉矶"
  #   type: vless
  #   server: your.server.com
  #   port: 443
  #   uuid: 00000000-0000-0000-0000-000000000000
  #   network: tcp
  #   tls: true
  #   udp: true
  #   flow: xtls-rprx-vision
  #   servername: your.server.com
  #   client-fingerprint: chrome
  #   reality-opts:
  #     public-key: YOUR_PUBLIC_KEY
  #     short-id: YOUR_SHORT_ID
  #
  # - name: "自建-Hysteria2"
  #   type: hysteria2
